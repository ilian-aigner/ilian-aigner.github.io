<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Ilian Aigner — B2B sales and STRK</title>
  <desc id="description">Portrait of Ilian Aigner beside his name, STRK co-founder role, and U.S. B2B sales internship focus.</desc>
  <defs>
    <linearGradient id="portrait-mask" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".2" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="1"/>
    </linearGradient>
    <linearGradient id="portrait-bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B0E13" stop-opacity="0"/>
      <stop offset="1" stop-color="#0B0E13" stop-opacity="1"/>
    </linearGradient>
    <mask id="portrait-fade"><rect x="575" y="0" width="625" height="630" fill="url(#portrait-mask)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="#0B0E13"/>
  <image href="/assets/images/ilian-portrait-shirt-1200.jpg" x="575" y="0" width="625" height="630" preserveAspectRatio="xMidYMid slice" mask="url(#portrait-fade)"/>
  <rect x="575" y="460" width="625" height="170" fill="url(#portrait-bottom)"/>
  <path d="M76 73h1048" stroke="#343A42"/>
  <text x="80" y="130" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#D1A36C">Founder work / B2B sales</text>
  <text x="75" y="275" font-family="Arial,sans-serif" font-size="115" font-weight="700" letter-spacing="-7" fill="#F4F1EB">Ilian</text>
  <text x="75" y="382" font-family="Arial,sans-serif" font-size="115" font-weight="700" letter-spacing="-7" fill="#F4F1EB">Aigner<tspan fill="#D1A36C">.</tspan></text>
  <text x="81" y="455" font-family="Arial,sans-serif" font-size="28" fill="#F4F1EB">Building STRK. Pursuing B2B sales.</text>
  <path d="M80 526h475" stroke="#343A42"/>
  <text x="80" y="567" font-family="Arial,sans-serif" font-size="21" fill="#AEB4BF">University of Delaware · Expected Fall 2028</text>
</svg>
